<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Crucible | Training and inference platform</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="app.css?v=20261031-4">
</head>
<body>
  <!-- The password gate runs server-side (netlify/edge-functions/crucible-gate.js). -->
  <section class="gate" id="signin">
    <div class="gate-card">
      <svg class="gate-mark" viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="1" y="1" width="54" height="54" rx="14" fill="#1d1d1f"/><path d="M16 19h24l-3.2 17.4A4 4 0 0 1 32.9 40H23.1a4 4 0 0 1-3.9-3.6z" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"/><path d="M28 34c-2.6 0-4.2-1.8-4.2-4 0-2.6 2.6-3.6 3.2-6.4 1.9 1.3 5.2 3.6 5.2 6.4 0 2.2-1.6 4-4.2 4z" fill="#2997ff"/></svg>
      <h1>Sign in to Crucible</h1>
      <p class="sub">Continue with Acme Corp single sign-on. Choose an account.</p>
      <div class="who" id="who"></div>
      <p class="fine">Protected by Acme SSO with OpenID Connect and PKCE. Production changes ask you to sign in again.</p>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="brand">
        <svg viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="1" y="1" width="54" height="54" rx="14" fill="#1d1d1f"/><path d="M16 19h24l-3.2 17.4A4 4 0 0 1 32.9 40H23.1a4 4 0 0 1-3.9-3.6z" stroke="#f5f5f7" stroke-width="2.6" stroke-linejoin="round"/><path d="M28 34c-2.6 0-4.2-1.8-4.2-4 0-2.6 2.6-3.6 3.2-6.4 1.9 1.3 5.2 3.6 5.2 6.4 0 2.2-1.6 4-4.2 4z" fill="#2997ff"/></svg>
        Crucible
      </div>
      <div class="workspace"><b>Acme Corp</b><span>Production · us-west, us-east, eu-west</span></div>
      <nav id="nav"></nav>
      <div class="nav-bottom" id="nav-bottom"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="bar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <h2 id="bar-title">Home</h2>
        <div class="bar-ctx" id="bar-ctx"></div>
        <span class="spacer"></span>
        <button class="chip-btn primary" id="btn-new"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>New</button>
        <button class="search-btn hide-sm" id="btn-search"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>Search<kbd>⌘K</kbd></button>
        <button class="icon-btn" id="btn-term" aria-label="Terminal" title="Terminal"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="m6 8 2.5 2L6 12m4.5 0h3.5"/></svg></button>
        <button class="icon-btn" id="btn-bell" aria-label="Notifications"></button>
        <button class="icon-btn" id="btn-help" aria-label="Help" title="Help"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.7a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 1.9-2.2 3.3M10 14.2v.1"/></svg></button>
        <button class="icon-btn" id="btn-insp" title="Show or hide the Inspector" aria-label="Toggle Inspector"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M12.5 4v12"/></svg></button>
        <button class="chip-btn role-btn" id="btn-role"></button>
      </header>
      <main class="view" id="view"></main>
      <footer class="statusbar" id="statusbar"></footer>
    </div>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=20261031-4"></script>
</body>
</html>
