[build]
  publish = "."
  command = ""

# Must precede the catch-all: without it, the article's css/js get rewritten to
# the landing page and the page loads unstyled.
[[redirects]]
  from = "/research/*"
  to   = "/research/:splat"
  status = 200

# Turbofan page disabled for now; remove this rule to bring it back.
[[redirects]]
  from = "/turbofan.html"
  to   = "/"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
