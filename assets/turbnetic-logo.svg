<svg width="300" height="300" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="400" height="400" fill="#020810"/>

  <!-- Outer nacelle ring -->
  <circle cx="200" cy="200" r="162" stroke="white" stroke-width="1.2" opacity="0.85"/>

  <!-- Subtle mid ring -->
  <circle cx="200" cy="200" r="112" stroke="white" stroke-width="0.6" opacity="0.18"/>

  <!-- Hub ring -->
  <circle cx="200" cy="200" r="28" stroke="white" stroke-width="1.4" opacity="0.9"/>

  <!-- Hub center dot -->
  <circle cx="200" cy="200" r="5" fill="white" opacity="0.95"/>

  <!-- 6 swept fan blades — thin curved lines, each rotated 60° -->
  <!-- Blade 0 — 90° root → 50° tip -->
  <path d="M 200,172 Q 231,115 300,81"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>

  <!-- Blade 1 — 150° root → 110° tip -->
  <path d="M 174,185 Q 142,131 147,54"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>

  <!-- Blade 2 — 210° root → 170° tip -->
  <path d="M 174,215 Q 111,216 47,173"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Blade 3 — 270° root → 230° tip -->
  <path d="M 200,228 Q 169,285 100,319"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.90"/>

  <!-- Blade 4 — 330° root → 290° tip -->
  <path d="M 226,215 Q 258,269 253,346"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>

  <!-- Blade 5 — 30° root → 350° tip -->
  <path d="M 226,185 Q 289,184 353,227"
        stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Outer ring tick marks at each blade tip position -->
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(0   200 200)"/>
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(60  200 200)"/>
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(120 200 200)"/>
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(180 200 200)"/>
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(240 200 200)"/>
  <line x1="200" y1="37"  x2="200" y2="48"  stroke="white" stroke-width="1" opacity="0.4" transform="rotate(300 200 200)"/>

</svg>
