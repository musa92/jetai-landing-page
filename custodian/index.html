<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f5f7">
  <title>Custodian | Enterprise AI data governance</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="app.css?v=20261023-6">
</head>
<body>
  <!-- The password gate runs server-side (netlify/edge-functions/custodian-gate.js);
       nothing on this page is served without a session. -->
  <section class="gate" id="signin">
    <div class="gate-card">
      <svg class="gate-mark" viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="1" y="1" width="54" height="54" rx="14" fill="#1d1d1f"/><path d="M28 13l12 4.5v9.2c0 7.9-5.1 14.4-12 16.3-6.9-1.9-12-8.4-12-16.3v-9.2L28 13z" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round"/><path d="M22.5 28.2l3.8 3.8 7.4-7.6" stroke="#2997ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Sign in to Custodian</h1>
      <p class="sub">Acme Corp single sign-on. Pick a demo account; each role sees and can do different things.</p>
      <div class="who" id="who"></div>
      <p class="fine">OpenID Connect with PKCE, simulated. Sessions last 15 minutes and carry only the role's scopes.</p>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="brand">
        <svg viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="1" y="1" width="54" height="54" rx="14" fill="#1d1d1f"/><path d="M28 13l12 4.5v9.2c0 7.9-5.1 14.4-12 16.3-6.9-1.9-12-8.4-12-16.3v-9.2L28 13z" stroke="#f5f5f7" stroke-width="2.6" stroke-linejoin="round"/><path d="M22.5 28.2l3.8 3.8 7.4-7.6" stroke="#2997ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Custodian
      </div>
      <div class="workspace"><b>Acme Corp</b><span>Production · us-west, eu-west</span></div>
      <nav id="nav"></nav>
      <div class="nav-bottom" id="nav-bottom"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="bar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <h2 id="bar-title">Home</h2>
        <span class="spacer"></span>
        <button class="search-btn hide-sm" id="btn-search"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>Search<kbd>⌘K</kbd></button>
        <button class="icon-btn" id="btn-bell" aria-label="Notifications"></button>
        <button class="chip-btn hide-sm" id="btn-reset" title="Reset all demo state">Reset</button>
        <button class="chip-btn primary" id="btn-demo">Demo</button>
        <button class="chip-btn role-btn" id="btn-role"></button>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=20261023-14"></script>
</body>
</html>
